name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the project version
        run: scripts/check-release-tag.sh "${{ github.ref_name }}"
      - name: Read the karrio fork snapshot the release is tested against
        id: karrio
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print("ref=" + tomllib.load(f)["tool"]["primepack"]["karrio-ref"])
          EOF
      - name: Check out the fork SDK into the workspace
        uses: actions/checkout@v5
        with:
          repository: Joaqim/karrio
          ref: ${{ steps.karrio.outputs.ref }}
          path: karrio-sdk
          submodules: false
      - name: Install the fork SDK and the plugin
        run: pip install -e karrio-sdk/modules/sdk -e .
      - name: Run the test suite
        run: python -m unittest discover -f -s tests
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          KARRIO_REF: ${{ steps.karrio.outputs.ref }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --notes "Requires Joaqim/karrio $KARRIO_REF."
